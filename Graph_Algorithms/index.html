<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graph Algorithms Tree Visualization</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body { display: flex; font-family: sans-serif; margin:0; }
#sidebar { width: 200px; padding: 10px; border-right:1px solid #ccc; }
#sidebar h2 { margin-bottom: 20px; }
.alg-btn {
  display: block;
  margin: 5px 0;
  padding: 5px;
  background: #7F9AC1; /* 莫蘭迪藍 */
  cursor: pointer;
  text-align: center;
  border-radius: 4px;
  color: white;
  transition: background 0.2s;
}
.alg-btn.active { background: #5C739F; } /* 點擊變深藍 */
#graph { flex:1; border:1px solid #ccc; }
circle { stroke:#333; stroke-width:1px; fill:#7F9AC1; }
line { stroke:#999; stroke-width:2px; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>Graph Algorithms</h2>
  <div class="alg-btn" data-alg="BFS">BFS</div>
  <div class="alg-btn" data-alg="DFS">DFS</div>
  <div class="alg-btn" data-alg="Dijkstra">Dijkstra</div>
</div>
<svg id="graph" width="600" height="400"></svg>

<script>
const svg = d3.select("#graph");
const width = +svg.attr("width"), height = +svg.attr("height");

// 四層樹狀資料
const treeData = {
  name: "Root",
  children:[
    {name:"L2-1", children:[
      {name:"L3-1", children:[{name:"L4-1"},{name:"L4-2"}]},
      {name:"L3-2", children:[{name:"L4-3"},{name:"L4-4"}]}
    ]},
    {name:"L2-2", children:[
      {name:"L3-3", children:[{name:"L4-5"},{name:"L4-6"}]},
      {name:"L3-4", children:[{name:"L4-7"},{name:"L4-8"}]}
    ]}
  ]
};

// ------------------ 畫樹 ------------------
let root = d3.hierarchy(treeData);

// 給每個節點 id
let nodeId = 0;
root.each(d=>{ d.id = nodeId++; });

d3.tree().size([width-100,height-100])(root);

function drawTree(){
  svg.selectAll("*").remove();

  // 畫邊
  svg.selectAll("line")
    .data(root.links())
    .enter()
    .append("line")
    .attr("x1", d=>d.source.x+50)
    .attr("y1", d=>d.source.y+50)
    .attr("x2", d=>d.target.x+50)
    .attr("y2", d=>d.target.y+50);

  // 畫節點
  svg.selectAll("circle")
    .data(root.descendants())
    .enter()
    .append("circle")
    .attr("cx", d=>d.x+50)
    .attr("cy", d=>d.y+50)
    .attr("r", 25)
    .attr("fill","#7F9AC1")
    .attr("class","tree-node")
    .attr("data-id", d=>d.id);

  // 標文字
  svg.selectAll("text")
    .data(root.descendants())
    .enter()
    .append("text")
    .attr("x", d=>d.x+50)
    .attr("y", d=>d.y+55)
    .attr("text-anchor","middle")
    .text(d=>d.data.name);
}

// 初始畫樹
drawTree();

// ------------------ 演算法動畫 ------------------
d3.selectAll(".alg-btn").on("click", function(){
  const alg = d3.select(this).attr("data-alg");
  
  // 按鈕變色
  d3.selectAll(".alg-btn").classed("active", false);
  d3.select(this).classed("active", true);
  
  runAlgorithm(alg);
});

function runAlgorithm(alg){
  const allCircles = svg.selectAll("circle");
  allCircles.attr("fill","#7F9AC1"); // 重置

  let order = [];
  if(alg==="BFS"){
    // BFS: 層次遍歷
    const queue = [];
    queue.push(root);
    while(queue.length>0){
      const node = queue.shift();
      order.push(node);
      if(node.children) queue.push(...node.children);
    }
  } else if(alg==="DFS"){
    // DFS: 深度優先
    function dfs(node){
      order.push(node);
      if(node.children) node.children.forEach(dfs);
    }
    dfs(root);
  } else if(alg==="Dijkstra"){
    // 模擬：按 id 排序
    order = root.descendants().sort((a,b)=>a.id-b.id);
  }

  order.forEach((d,i)=>{
    setTimeout(()=>{
      allCircles.filter(n=>+n.getAttribute("data-id")===d.id)
        .attr("fill","#E6D08C"); // 莫蘭迪黃
    }, i*500);
  });
}
</script>
</body>
</html>

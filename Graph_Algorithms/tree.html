<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graph Algorithms Tree Visualization</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    display: flex;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: #f4f6fa;
    height: 100vh;
  }
  #main {
    display: flex;
    flex: 1;
  }
  #sidebar {
    width: 220px;
    padding: 20px;
    background: #2c3e50;
    color: white;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
  }
  #sidebar h2 {
    margin-top: 0;
    font-size: 20px;
    border-bottom: 1px solid #7f8c8d;
    padding-bottom: 10px;
  }
  .alg-btn {
    display: block;
    margin: 10px 0;
    padding: 10px;
    background: #34495e;
    cursor: pointer;
    text-align: center;
    border-radius: 5px;
    transition: background 0.3s;
    color: white;
  }
  .alg-btn:hover { background: #3d566e; }
  .alg-btn.active { background: #1abc9c; }
  #graph-area {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  #graph {
    flex: 1;
    border: 1px solid #ccc;
    background: white;
    border-radius: 8px;
  }
  circle { stroke:#333; stroke-width:1px; }
  line { stroke:#999; stroke-width:2px; }
  #info {
    margin-top: 20px;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    font-size: 15px;
    line-height: 1.8;
    color: #2c3e50;
  }
  #info h3 {
    margin-top: 0;
    font-size: 18px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 8px;
  }
  #info p {
    margin: 8px 0;
  }
</style>
</head>
<body>
<div id="main">
  <div id="sidebar">
    <h2>Graph Algorithms</h2>
    <div class="alg-btn" data-alg="BFS">BFS</div>
    <div class="alg-btn" data-alg="DFS">DFS</div>
    <div class="alg-btn" data-alg="Dijkstra">Dijkstra</div>
  </div>
  <div id="graph-area">
    <svg id="graph" width="800" height="500"></svg>
    <div id="info">
      <div id="details">Click an algorithm to see its animation and complexity.</div>
    </div>
  </div>
</div>

<script>
const svg = d3.select("#graph");
const width = +svg.attr("width"), height = +svg.attr("height");

const treeData = {
  name: "Root", category: "A",
  children: [
    {
      name: "Level2-A", category: "B", weight: 2,
      children: [
        {
          name: "Level3-A1", category: "C", weight: 2,
          children: [
            { name: "Leaf-A1-1", category: "A", weight: 2 },
            { name: "Leaf-A1-2", category: "B", weight: 2 }
          ]
        },
        {
          name: "Level3-A2", category: "B", weight: 2,
          children: [
            { name: "Leaf-A2-1", category: "C", weight: 2 },
            { name: "Leaf-A2-2", category: "A", weight: 2 }
          ]
        }
      ]
    },
    {
      name: "Level2-B", category: "C", weight: 1,
      children: [
        {
          name: "Level3-B1", category: "A", weight: 2,
          children: [
            { name: "Leaf-B1-1", category: "B", weight: 2 },
            { name: "Leaf-B1-2", category: "C", weight: 2 }
          ]
        },
        {
          name: "Level3-B2", category: "C", weight: 1,
          children: [
            { name: "Leaf-B2-1", category: "A", weight: 1 },
            { name: "Leaf-B2-2", category: "B", weight: 2 }
          ]
        }
      ]
    }
  ]
};

const morandiBlue = "#A7C7E7";
const morandiYellow = "#E6D08C";

let currentRoot = null;
let animationQueue = [];

function drawTree(rootData){
  svg.selectAll("*").remove();
  const root = d3.hierarchy(rootData);
  d3.tree().size([width-100,height-100])(root);
  currentRoot = root;

  let labelIndex = 0;
  const labels = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  svg.selectAll("line")
    .data(root.links())
    .enter()
    .append("line")
    .attr("x1", d=>d.source.x+50)
    .attr("y1", d=>d.source.y+50)
    .attr("x2", d=>d.target.x+50)
    .attr("y2", d=>d.target.y+50);

  svg.selectAll("circle")
    .data(root.descendants())
    .enter()
    .append("circle")
    .attr("cx", d=>d.x+50)
    .attr("cy", d=>d.y+50)
    .attr("r", 25)
    .attr("fill", morandiBlue)
    .attr("class","tree-node");

  svg.selectAll("text")
    .data(root.descendants())
    .enter()
    .append("text")
    .attr("x", d=>d.x+50)
    .attr("y", d=>d.y+55)
    .attr("text-anchor","middle")
    .text(d => labels[labelIndex++]);
}

drawTree(treeData);

const complexityInfo = {
  BFS: {
    name: "Breadth-First Search (BFS)",
    time: "Time Complexity: O(V + E)",
    space: "Space Complexity: O(V)",
    usage: "Explores nodes level by level using a queue.",
    suitable: "Best for shortest path in unweighted graphs, social network analysis, Biogo graph traversal."
  },
  DFS: {
    name: "Depth-First Search (DFS)",
    time: "Time Complexity: O(V + E)",
    space: "Space Complexity: O(V)",
    usage: "Explores as deep as possible before backtracking.",
    suitable: "Ideal for cycle detection, topological sorting, maze solving, and tree traversals."
  },
  Dijkstra: {
    name: "Dijkstra's Algorithm",
    time: "Time Complexity: O((V + E) log V)",
    space: "Space Complexity: O(V)",
    usage: "Finds shortest paths from a source node in weighted graphs.",
    suitable: "Used in GPS navigation, network routing, and weighted graph analysis."
  }
};

d3.selectAll(".alg-btn").on("click", function(){
  const alg = d3.select(this).attr("data-alg");
  d3.selectAll(".alg-btn").classed("active", false);
  d3.select(this).classed("active", true);
  runAlgorithm(alg);
  updateInfo(alg);
});

function runAlgorithm(alg){
  animationQueue.forEach(id => clearTimeout(id));
  animationQueue = [];

  svg.selectAll("circle")
    .interrupt()
    .attr("fill", morandiBlue);

  let order = [];

  if(alg==="BFS"){
    const queue = [currentRoot];
    while(queue.length>0){
      const node = queue.shift();
      order.push(node);
      if(node.children) queue.push(...node.children);
    }
  }else if(alg==="DFS"){
    function dfs(node){
      order.push(node);
      if(node.children) node.children.forEach(dfs);
    }
    dfs(currentRoot);
  }else if(alg==="Dijkstra"){
    // Dijkstra: 單源最短路徑 (依據 weight 欄位)
    const nodes = currentRoot.descendants();
    const dist = {};
    nodes.forEach(n => dist[n.data.name] = Infinity);
    dist[currentRoot.data.name] = 0;
    const visited = new Set();
    let visitOrder = [];
    while(visited.size < nodes.length){
      // 找未訪問且距離最小的節點
      let minNode = null, minDist = Infinity;
      nodes.forEach(n => {
        if(!visited.has(n.data.name) && dist[n.data.name] < minDist){
          minDist = dist[n.data.name];
          minNode = n;
        }
      });
      if(!minNode) break;
      visited.add(minNode.data.name);
      visitOrder.push(minNode);
      // 更新鄰居距離
      if(minNode.children){
        minNode.children.forEach(child => {
          const w = child.data.weight || 1;
          if(dist[child.data.name] > dist[minNode.data.name] + w){
            dist[child.data.name] = dist[minNode.data.name] + w;
          }
        });
      }
      // 也可以往 parent 更新（如果是無向圖）
      if(minNode.parent){
        const w = minNode.data.weight || 1;
        if(dist[minNode.parent.data.name] > dist[minNode.data.name] + w){
          dist[minNode.parent.data.name] = dist[minNode.data.name] + w;
        }
      }
    }
    order = visitOrder;
  }

  order.forEach((node, i) => {
    const id = setTimeout(() => {
      svg.selectAll("circle")
        .filter(d => d === node)
        .transition()
        .duration(300)
        .attr("fill", morandiYellow);
    }, i * 400);
    animationQueue.push(id);
  });
}
function updateInfo(alg){
  const info = complexityInfo[alg];
  d3.select("#details").html(`
    <h3>${info.name}</h3>
    <p><strong>${info.time}</strong></p>
    <p><strong>${info.space}</strong></p>
    <p><em>${info.usage}</em></p>
    <p><strong>Suitable for:</strong> ${info.suitable}</p>
  `);
}

</script>
</body>
</html>
